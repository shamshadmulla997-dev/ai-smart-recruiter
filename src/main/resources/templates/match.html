<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Matching</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 60%), #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 40px; font-weight: 800; margin-bottom: 12px; letter-spacing: -1px; }
        .gradient-text {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0aec0; font-size: 16px; }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        input::placeholder { color: #4a5568; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .roles-hint {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .roles-hint h4 {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .role-chip {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.25);
            color: #a8b5ff;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px 6px 4px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .role-chip:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #fff;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI <span class="gradient-text">Job Matching</span></h1>
            <p>Enter a job role and find best-fit candidates</p>
        </div>

        <div class="card">
            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form method="post" action="/match">
                <label>Job Role</label>
                <input type="text" name="jobRole" id="roleInput"
                       placeholder="e.g. Java Developer, Data Scientist, Frontend Developer"
                       required>
                <button type="submit">🎯 Find Best Candidates</button>
            </form>

            <div class="roles-hint">
                <h4>Available Roles (click to use)</h4>
                <span th:each="role : ${roles}" class="role-chip" th:text="${role}">Java Developer</span>
            </div>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
    <script>
    document.querySelectorAll('.role-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
            document.getElementById('roleInput').value = this.innerText;
        });
    });
</script>
<!-- AI CHAT WIDGET -->
<div id="chatWidget" style="position:fixed;bottom:20px;right:20px;z-index:9999;font-family:'Inter',sans-serif;">
    <!-- Bubble Button -->
    <button id="chatBubble" onclick="toggleChat()" style="
        width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
        background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
        font-size:28px;box-shadow:0 10px 30px rgba(102,126,234,0.5);
        transition:transform 0.3s;">
        💬
    </button>

    <!-- Chat Panel -->
    <div id="chatPanel" style="
        display:none;position:absolute;bottom:80px;right:0;width:360px;height:500px;
        background:#0f1435;border:1px solid rgba(102,126,234,0.3);
        border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
        display:none;flex-direction:column;overflow:hidden;">

        <!-- Header -->
        <div style="padding:16px 20px;background:linear-gradient(135deg,#667eea,#764ba2);
                    color:#fff;font-weight:700;font-size:15px;display:flex;
                    justify-content:space-between;align-items:center;">
            <span>🤖 AI Career Assistant</span>
            <span onclick="toggleChat()" style="cursor:pointer;font-size:20px;">✕</span>
        </div>

        <!-- Messages -->
        <div id="chatMessages" style="flex:1;padding:16px;overflow-y:auto;
             display:flex;flex-direction:column;gap:10px;">
            <div style="background:rgba(102,126,234,0.15);padding:10px 14px;border-radius:12px;
                        max-width:85%;font-size:13px;line-height:1.5;color:#cbd5e0;">
                Hi! 👋 I'm your AI career assistant. Ask me anything about skills, roles, or interviews!
            </div>
        </div>

        <!-- Input -->
        <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.08);
                    display:flex;gap:8px;background:rgba(255,255,255,0.02);">
            <input type="text" id="chatInput" placeholder="Type a message..."
                   style="flex:1;padding:10px 14px;background:rgba(255,255,255,0.05);
                          border:1px solid rgba(255,255,255,0.1);border-radius:10px;
                          color:#fff;font-size:13px;outline:none;"
                   onkeypress="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" style="
                padding:10px 16px;background:linear-gradient(135deg,#667eea,#764ba2);
                color:#fff;border:none;border-radius:10px;cursor:pointer;
                font-weight:600;font-size:13px;">
                Send
            </button>
        </div>
    </div>
</div>

<script>
    let chatOpen = false;

    function toggleChat() {
        chatOpen = !chatOpen;
        const panel = document.getElementById('chatPanel');
        panel.style.display = chatOpen ? 'flex' : 'none';
    }

    async function sendChat() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;

        addMessage(msg, 'user');
        input.value = '';

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            addMessage(data.reply, 'bot');
        } catch (e) {
            addMessage('⚠️ Something went wrong. Try again.', 'bot');
        }
    }

    function addMessage(text, sender) {
        const box = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.padding = '10px 14px';
        div.style.borderRadius = '12px';
        div.style.maxWidth = '85%';
        div.style.fontSize = '13px';
        div.style.lineHeight = '1.5';
        div.style.whiteSpace = 'pre-line';

        if (sender === 'user') {
            div.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';
            div.style.color = '#fff';
            div.style.alignSelf = 'flex-end';
        } else {
            div.style.background = 'rgba(102,126,234,0.15)';
            div.style.color = '#cbd5e0';
            div.style.alignSelf = 'flex-start';
        }

        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
