<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Matching</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 60%), #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 40px; font-weight: 800; margin-bottom: 12px; letter-spacing: -1px; }
        .gradient-text {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0aec0; font-size: 16px; }
        .card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        input::placeholder { color: #4a5568; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
        }
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .roles-hint {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .roles-hint h4 {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }
        .role-chip {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.25);
            color: #a8b5ff;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin: 4px 6px 4px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .role-chip:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #fff;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI <span class="gradient-text">Job Matching</span></h1>
            <p>Enter a job role and find best-fit candidates</p>
        </div>

        <div class="card">
            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form method="post" action="/match">
                <label>Job Role</label>
                <input type="text" name="jobRole" id="roleInput"
                       placeholder="e.g. Java Developer, Data Scientist, Frontend Developer"
                       required>
                <button type="submit">🎯 Find Best Candidates</button>
            </form>

            <div class="roles-hint">
                <h4>Available Roles (click to use)</h4>
                <span th:each="role : ${roles}" class="role-chip" th:text="${role}">Java Developer</span>
            </div>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
    <script>
    document.querySelectorAll('.role-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
            document.getElementById('roleInput').value = this.innerText;
        });
    });
</script>
</body>
</html>
