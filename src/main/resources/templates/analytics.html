<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - AI Smart Recruiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(102, 126, 234, 0.15) 0%, transparent 50%), #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 40px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        .gradient-text {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0aec0; font-size: 16px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
        }
        .stat-icon { font-size: 32px; margin-bottom: 10px; }
        .stat-num {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            color: #a0aec0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }
        .chart-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
        }
        .chart-card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .recent-list {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
        }
        .recent-list h3 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .recent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .recent-item:last-child { border-bottom: none; }
        .recent-item h4 { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
        .recent-item p { font-size: 12px; color: #718096; }
        .exp-badge {
            background: rgba(102, 126, 234, 0.15);
            color: #a8b5ff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 <span class="gradient-text">Analytics</span></h1>
            <p>Insights from all candidate resumes</p>
        </div>

        <div th:if="${totalResumes == 0}" class="empty">
            <h3>No data yet</h3>
            <p>Upload some resumes to see insights.</p>
            <a href="/upload" style="color:#667eea; margin-top:20px; display:inline-block;">Upload Resume</a>
        </div>

        <div th:if="${totalResumes > 0}">

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📄</div>
                    <div class="stat-num" th:text="${totalResumes}">0</div>
                    <div class="stat-label">Total Resumes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-num" th:text="${avgExperience} + 'y'">0</div>
                    <div class="stat-label">Avg Experience</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-num" th:text="${#maps.size(skillFreq)}">0</div>
                    <div class="stat-label">Unique Skills</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏢</div>
                    <div class="stat-num" th:text="${#maps.size(topRoles)}">0</div>
                    <div class="stat-label">Active Roles</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>🎓 Top Skills</h3>
                    <div class="chart-container">
                        <canvas id="skillsChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <h3>🎯 Best-Match Roles</h3>
                    <div class="chart-container">
                        <canvas id="rolesChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="recent-list">
                <h3>📋 Recent Submissions</h3>
                <div th:each="r : ${resumes}" class="recent-item">
                    <div>
                        <h4 th:text="${r.candidateName}">Name</h4>
                        <p th:text="${r.email}">email</p>
                    </div>
                    <span class="exp-badge" th:if="${r.experienceYears != null}"
                          th:text="${r.experienceYears} + ' yrs'">3 yrs</span>
                </div>
            </div>

        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <!-- Data injection for charts -->
    <div id="skillData"
         th:attr="data-skills=${skillFreq.keySet()},data-counts=${skillFreq.values()}"
         style="display:none;"></div>
    <div id="roleData"
         th:attr="data-roles=${topRoles.keySet()},data-rolecounts=${topRoles.values()}"
         style="display:none;"></div>

    <script th:if="${totalResumes > 0}">
        const skillEl = document.getElementById('skillData');
        const skillLabels = (skillEl.dataset.skills || '').replace(/[\[\]]/g, '').split(',').filter(Boolean);
        const skillCounts = (skillEl.dataset.counts || '').replace(/[\[\]]/g, '').split(',').filter(Boolean).map(Number);

        const roleEl = document.getElementById('roleData');
        const roleLabels = (roleEl.dataset.roles || '').replace(/[\[\]]/g, '').split(',').filter(Boolean);
        const roleCounts = (roleEl.dataset.rolecounts || '').replace(/[\[\]]/g, '').split(',').filter(Boolean).map(Number);

        // Skills bar chart
        if (skillLabels.length) {
            new Chart(document.getElementById('skillsChart'), {
                type: 'bar',
                data: {
                    labels: skillLabels,
                    datasets: [{
                        label: 'Candidates',
                        data: skillCounts,
                        backgroundColor: 'rgba(102, 126, 234, 0.7)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#a0aec0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#a0aec0' }, grid: { display: false } }
                    }
                }
            });
        }

        // Roles doughnut chart
        if (roleLabels.length) {
            new Chart(document.getElementById('rolesChart'), {
                type: 'doughnut',
                data: {
                    labels: roleLabels,
                    datasets: [{
                        data: roleCounts,
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(240, 147, 251, 0.8)',
                            'rgba(251, 191, 36, 0.8)',
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(239, 68, 68, 0.8)'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#a0aec0', padding: 15, font: { size: 12 } }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
