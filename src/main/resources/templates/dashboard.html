<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Smart Recruiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(102, 126, 234, 0.15) 0%, transparent 50%), #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 60px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 40px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        .gradient-text {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0aec0; font-size: 16px; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px 30px;
            text-align: center;
            min-width: 160px;
        }
        .stat-box .num {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-box .label {
            color: #a0aec0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        .resume-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .resume-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 24px;
            transition: transform 0.3s, border-color 0.3s;
            text-decoration: none;
            color: #fff;
            display: block;
            position: relative;
        }
        .resume-card:hover {
            transform: translateY(-4px);
            border-color: rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 0.05);
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .resume-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .resume-card .email { color: #a0aec0; font-size: 13px; margin-bottom: 14px; }
        .meta {
            display: flex;
            gap: 16px;
            color: #718096;
            font-size: 12px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #a0aec0;
        }
        .empty h3 { color: #fff; margin-bottom: 12px; font-size: 22px; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 40px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #fff; }
        .nav-top {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .nav-top a {
            color: #a0aec0;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 14px;
            transition: all 0.3s;
        }
        .nav-top a:hover { color: #fff; border-color: #667eea; background: rgba(102,126,234,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 <span class="gradient-text">Resume Dashboard</span></h1>
            <p>All candidates who submitted their profiles</p>
        </div>

        <div class="nav-top">
            <a href="/">🏠 Home</a>
            <a href="/match">🎯 Match</a>
            <a href="/upload">📤 Upload</a>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <div class="num" th:text="${total}">0</div>
                <div class="label">Total Resumes</div>
            </div>
        </div>

        <div th:if="${resumes.isEmpty()}" class="empty">
            <h3>No resumes yet</h3>
            <p>Ask candidates to upload their resumes.</p>
            <a href="/upload" class="back-btn">Upload Resume</a>
        </div>

        <div class="resume-grid">
            <a th:each="r : ${resumes}" th:href="@{'/career-guide/' + ${r.id}}" class="resume-card">
                <div class="avatar" th:text="${r.candidateName != null ? r.candidateName.substring(0,1).toUpperCase() : '?'}">R</div>
                <h3 th:text="${r.candidateName}">Name</h3>
                <p class="email" th:text="${r.email}">email</p>
                <div class="meta">
                    <span th:if="${r.experienceYears != null}" th:text="${r.experienceYears} + ' yrs exp'">3 yrs exp</span>
                    <span th:if="${r.phone != null}" th:text="${r.phone}">phone</span>
                </div>
            </a>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
