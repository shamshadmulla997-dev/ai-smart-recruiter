<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Smart Recruiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 60%), #0a0e27;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 50px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 36px; }
        .header h1 { font-size: 30px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
        .gradient-text {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #a0aec0; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        input::placeholder { color: #4a5568; }
        select option { background: #0f1435; color: #fff; }
        .role-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .role-btn {
            padding: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #cbd5e0;
        }
        .role-btn input { display: none; }
        .role-btn:has(input:checked) {
            background: rgba(102, 126, 234, 0.15);
            border-color: #667eea;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4);
        }
        .msg-error {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: center;
        }
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #a0aec0;
        }
        .footer-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create <span class="gradient-text">Account</span></h1>
            <p>Join AI Smart Recruiter today</p>
        </div>

        <div th:if="${error}" class="msg-error" th:text="${error}"></div>

        <form method="post" action="/register">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label>I am a...</label>
                <div class="role-group">
                    <label class="role-btn">
                        <input type="radio" name="role" value="CANDIDATE" checked>
                        👤 Candidate
                    </label>
                    <label class="role-btn">
                        <input type="radio" name="role" value="RECRUITER">
                        💼 Recruiter
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Pick a username (min 3 chars)" required minlength="3">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirmPassword" placeholder="Repeat password" required minlength="6">
            </div>

            <button type="submit">🚀 Create Account</button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
</body>
</html>
